# Ajustado a una máquina de 5,7 GB de RAM: con -Xmx2G el daemon de Gradle más
# el daemon de Kotlin más el frontend de Dart no entran y el kernel mata el
# daemon a mitad de build ("Gradle build daemon disappeared unexpectedly").
org.gradle.jvmargs=-Xmx1G -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=192m -XX:+HeapDumpOnOutOfMemoryError

# Compila Kotlin dentro del proceso de Gradle en vez de levantar una JVM
# aparte: es algo más lento, pero ahorra varios cientos de MB de pico.
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=false
org.gradle.workers.max=1

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
