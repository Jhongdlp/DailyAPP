name: Release

# Se dispara al empujar un tag con formato vX.Y.Z (ej: v1.0.1)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # Necesario para crear el GitHub Release

jobs:
  build-release:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      # La versión del APK sale SIEMPRE del tag, no del pubspec.yaml. Si se
      # desincronizan, la app instalada se reporta con una versión vieja y el
      # UpdateService la sigue viendo como desactualizada para siempre.
      - name: Derive version from tag
        run: |
          BUILD_NAME="${GITHUB_REF_NAME#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$BUILD_NAME"
          # versionCode monótono derivado del tag: 2.2.0 -> 20200.
          # Android rechaza instalar un versionCode menor que el ya instalado.
          BUILD_NUMBER=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "BUILD_NAME=$BUILD_NAME" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      # Sin esta comprobación el build sale "bien" pero con el valor por defecto
      # de kLocalAiUrl (10.0.2.2, el alias del emulador): en un móvil real toda
      # llamada a la IA se queda colgada hasta agotar el timeout. Pasó en
      # v2.7.2, cuando se sacó la IP del código sin añadir el define aquí.
      - name: Check AI server secret
        env:
          LOCAL_AI_URL: ${{ secrets.LOCAL_AI_URL }}
        run: |
          if [ -z "$LOCAL_AI_URL" ]; then
            echo "::error::Falta el secret LOCAL_AI_URL. Sin él el APK no puede hablar con Ollama."
            exit 1
          fi

      - name: Build release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4G"
          SIGNING_STORE_FILE: upload-keystore.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          flutter build apk --release \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=LOCAL_AI_URL="${{ secrets.LOCAL_AI_URL }}"

      - name: Rename APK with version
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/SistemDaily-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: SistemDaily ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/SistemDaily-${{ github.ref_name }}.apk
